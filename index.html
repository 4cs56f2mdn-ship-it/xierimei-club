<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xierimei.club</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 32px;
      padding: 50px 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #eeeeef;
      font-size: 14px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 72px);
      letter-spacing: -3px;
    }

    p {
      margin: 20px auto 0;
      max-width: 480px;
      color: #6e6e73;
      font-size: 18px;
      line-height: 1.7;
    }

    .domain {
      margin-top: 34px;
      font-size: 15px;
      color: #86868b;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">● ONLINE</div>

    <h1>Hello.</h1>

    <p>
      xierimei.club 已成功连接到网站。
      <br>
      It is building!。
    </p>

    <div class="domain">
      xierimei.club
    </div>
  </main>
</body>
</html>
